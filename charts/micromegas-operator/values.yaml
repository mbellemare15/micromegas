image:
  repository: marcantoinedesroches/micromegas-operator
  tag: ""            # defaults to appVersion
  pullPolicy: IfNotPresent

# Required. Stable identifier of this cluster; becomes part of every managed
# screen's managed_by marker (k8s://<clusterName>/<namespace>/<name>).
clusterName: ""

# Empty watches all namespaces (ClusterRole). Set to restrict to one namespace (Role).
watchNamespace: ""

healthPort: 8080

# Self-telemetry into a Micromegas ingestion server. Leave url empty to disable.
telemetry:
  url: ""
  apiKeySecret:
    name: ""
    key: api-key

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

# Defaults satisfy the restricted Pod Security Standard. The image runs as
# 65532:65532 and the operator writes to no path on disk.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceAccount:
  annotations: {}

nameOverride: ""
fullnameOverride: ""

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: screens.micromegas.info
spec:
  group: micromegas.info
  names:
    kind: Screen
    plural: screens
    singular: screen
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.folderPath
      name: Folder
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ScreenSpec via `CustomResource`
        properties:
          spec:
            properties:
              config:
                description: Notebook config, same shape as the REST API's config field.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              configFrom:
                nullable: true
                properties:
                  configMapKeyRef:
                    properties:
                      key:
                        type: string
                      name:
                        description: ConfigMap in the Screen's namespace.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - configMapKeyRef
                type: object
              folderPath:
                default: ''
                description: Folder path such as "team/prod". Empty means root. The folder is created implicitly.
                type: string
                x-kubernetes-validations:
                - message: folderPath segments must be lowercase letters, digits, or hyphens
                  rule: self == '' || self.matches('^[a-z0-9-]+(/[a-z0-9-]+)*$')
              instanceSelector:
                description: Selects the MicromegasInstance objects this screen is written to.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                    items:
                      description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies to.
                          type: string
                        operator:
                          description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                          items:
                            type: string
                          type: array
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
              name:
                description: Server-side screen name. Defaults to metadata.name. Must satisfy the server's slug rules.
                nullable: true
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
                - message: name must be 3-100 lowercase letters, digits, or hyphens, starting with a letter
                  rule: self.matches('^[a-z][a-z0-9-]{1,98}[a-z0-9]$')
              screenType:
                default: notebook
                type: string
                x-kubernetes-validations:
                - message: screenType is immutable
                  rule: self == oldSelf
            required:
            - instanceSelector
            type: object
            x-kubernetes-validations:
            - message: exactly one of config or configFrom must be set
              rule: has(self.config) != has(self.configFrom)
            - message: name cannot be added or removed after creation
              rule: has(self.name) == has(oldSelf.name)
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instances:
                default: []
                items:
                  properties:
                    configHash:
                      nullable: true
                      type: string
                    error:
                      nullable: true
                      type: string
                    lastSyncedAt:
                      description: RFC 3339.
                      nullable: true
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    screenName:
                      type: string
                  required:
                  - name
                  - namespace
                  - screenName
                  type: object
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: Screen
        type: object
    served: true
    storage: true
    subresources:
      status: {}
